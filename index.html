<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Receipt Capture</title>
  <!-- Scanbot Web SDK — document detection -->
  <script src="https://cdn.jsdelivr.net/npm/scanbot-web-sdk@8.0.1/bundle/ScanbotSDK.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── iOS System Colors ── */
    :root {
      --bg:          #F2F2F7;
      --surface:     #FFFFFF;
      --surface2:    #F2F2F7;
      --blue:        #007AFF;
      --red:         #FF3B30;
      --green:       #34C759;
      --text:        #000000;
      --text2:       rgba(60, 60, 67, 0.85);
      --text-muted:  #8E8E93;
      --sep:         rgba(60, 60, 67, 0.29);
      --sep-opaque:  #C6C6C8;
      --fill:        rgba(118, 118, 128, 0.12);
      --fill2:       rgba(118, 118, 128, 0.08);
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      /* Legacy aliases used by existing JS inline-style references */
      --accent:      #FF3B30;
      --accent2:     #007AFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #000000;
        --surface:    #1C1C1E;
        --surface2:   #2C2C2E;
        --text:       #FFFFFF;
        --text2:      rgba(235, 235, 245, 0.75);
        --text-muted: #8E8E93;
        --sep:        rgba(84, 84, 88, 0.65);
        --sep-opaque: #38383A;
        --fill:       rgba(118, 118, 128, 0.24);
        --fill2:      rgba(118, 118, 128, 0.18);
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: var(--safe-top);
    }

    /* ── Navigation Bar ── */
    header {
      height: 44px;
      background: rgba(242, 242, 247, 0.88);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--sep);
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    @media (prefers-color-scheme: dark) {
      header { background: rgba(28, 28, 30, 0.88); }
    }
    header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.4px; }
    #app-version { font-size: 11px; color: var(--text-muted); margin-right: 6px; }
    #receipt-count {
      background: var(--red);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      padding: 1px 7px;
      min-width: 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ── Refresh button ── */
    #refresh-btn {
      background: none; border: none;
      color: var(--blue); cursor: pointer;
      padding: 4px; margin-right: 6px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s;
    }
    #refresh-btn:active { opacity: .6; }
    #refresh-btn svg { width: 19px; height: 19px; }

    /* ── Panels ── */
    .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; min-height: 0; }
    .panel.active { display: flex; }

    /* ── Bottom Tab Bar ── */
    nav {
      display: flex;
      background: rgba(242, 242, 247, 0.92);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 0.5px solid var(--sep);
      height: calc(49px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      nav { background: rgba(28, 28, 30, 0.92); }
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 0 2px;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.1px;
      transition: color 0.1s;
    }
    nav button svg { width: 26px; height: 26px; }
    nav button.active { color: var(--blue); }

    /* ── Camera Panel ── */
    #camera-panel { position: relative; background: #000; }

    #video-container {
      position: relative;
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #video { width: 100%; height: 100%; object-fit: cover; }

    /* Viewfinder corners */
    #viewfinder { position: absolute; inset: 0; pointer-events: none; }
    .vf-corner {
      position: absolute;
      width: 22px; height: 22px;
      border-color: rgba(255,255,255,.9);
      border-style: solid;
    }
    .vf-corner.tl { top: 14%; left: 8%; border-width: 2.5px 0 0 2.5px; border-radius: 3px 0 0 0; }
    .vf-corner.tr { top: 14%; right: 8%; border-width: 2.5px 2.5px 0 0; border-radius: 0 3px 0 0; }
    .vf-corner.bl { bottom: 14%; left: 8%; border-width: 0 0 2.5px 2.5px; border-radius: 0 0 0 3px; }
    .vf-corner.br { bottom: 14%; right: 8%; border-width: 0 2.5px 2.5px 0; border-radius: 0 0 3px 0; }

    /* Flash */
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .05s; }
    #flash.flash { opacity: 1; }

    /* Camera controls bar */
    #camera-controls {
      background: rgba(0,0,0,.6);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* iOS-style shutter button */
    #capture-btn {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 3px solid #fff;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: transform .1s, opacity .1s;
      -webkit-tap-highlight-color: transparent;
    }
    #capture-btn:active { transform: scale(.91); opacity: .8; }
    #capture-btn::after {
      content: '';
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: #fff;
    }

    #flip-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,.18);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .ctrl-placeholder { width: 40px; }

    /* No-camera */
    #no-camera {
      display: none; flex: 1; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; text-align: center; padding: 32px 24px;
    }
    #no-camera.visible { display: flex; }
    #no-camera .icon { font-size: 52px; }
    #no-camera p { color: var(--text-muted); font-size: 15px; line-height: 1.6; }
    #retry-camera {
      margin-top: 8px; padding: 12px 28px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    }

    /* ── Preview Modal — iOS bottom sheet ── */
    #preview-modal {
      display: none;
      position: fixed; inset: 0;
      z-index: 200;
      align-items: flex-end;
    }
    #preview-modal.visible { display: flex; }
    #preview-modal::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,.4);
    }

    #preview-sheet {
      position: relative;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      padding: 0 20px;
      padding-bottom: calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-height: 92vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: sheetUp 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 36px; height: 5px;
      background: var(--fill);
      border-radius: 3px;
      margin: 12px 0 2px;
      flex-shrink: 0;
    }

    #preview-modal h2 {
      font-size: 17px; font-weight: 600;
      letter-spacing: -0.3px; color: var(--text);
    }

    #preview-img {
      width: 100%; max-height: 42vh;
      border-radius: 12px;
      object-fit: contain;
      background: var(--surface2);
    }

    /* ── Auto-crop UI ── */
    #crop-status {
      font-size: 13px; color: var(--text-muted);
      min-height: 16px; text-align: center;
    }
    #crop-status.found { color: var(--green); }

    /* iOS segmented control */
    #crop-toggle {
      display: none;
      background: var(--fill);
      border-radius: 9px;
      padding: 2px;
      width: 100%;
    }
    .crop-opt {
      flex: 1; padding: 7px 12px;
      border: none; border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: background .15s, color .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .crop-opt.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 0.5px 1px rgba(0,0,0,.08);
    }

    #receipt-name-input {
      width: 100%; padding: 11px 14px;
      background: var(--fill2);
      border: none; border-radius: 10px;
      color: var(--text); font-size: 16px; font-family: inherit;
    }
    #receipt-name-input::placeholder { color: var(--text-muted); }
    #receipt-name-input:focus { outline: none; }

    .modal-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .modal-actions button {
      width: 100%; padding: 15px;
      border-radius: 14px; border: none;
      font-size: 17px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .12s;
    }
    .modal-actions button:active { opacity: .72; }
    #save-btn    { background: var(--blue); color: #fff; }
    #discard-btn { background: var(--fill); color: var(--red); }

    /* ── Gallery Panel ── */
    #gallery-panel { overflow-y: auto; background: var(--bg); -webkit-overflow-scrolling: touch; }

    #storage-bar-wrap {
      padding: 10px 16px 12px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--sep);
      flex-shrink: 0;
    }
    #storage-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    #storage-track { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; }
    #storage-fill  { height: 100%; background: var(--blue); border-radius: 2px; transition: width .4s, background .4s; width: 0%; }

    #gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--sep-opaque);
    }
    .receipt-card {
      background: var(--surface);
      overflow: hidden; cursor: pointer;
      transition: opacity .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .receipt-card:active { opacity: .65; }
    .receipt-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; }
    .receipt-card-label {
      padding: 8px 10px;
      font-size: 12px; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: -0.1px;
    }

    #empty-gallery {
      display: none; flex: 1; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; padding: 48px 24px; text-align: center;
    }
    #empty-gallery.visible { display: flex; }
    #empty-gallery .icon { font-size: 56px; opacity: .4; }
    #empty-gallery p { color: var(--text-muted); font-size: 15px; line-height: 1.5; }

    /* ── Detail Modal ── */
    #detail-modal {
      display: none; position: fixed; inset: 0;
      background: var(--bg); z-index: 200;
      flex-direction: column;
      padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
    }
    #detail-modal.visible { display: flex; }

    #detail-toolbar {
      display: flex; align-items: center;
      height: 44px; padding: 0 8px;
      background: rgba(242, 242, 247, 0.88);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--sep);
      gap: 4px; flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      #detail-toolbar { background: rgba(28, 28, 30, 0.88); }
    }
    #detail-name {
      font-size: 15px; font-weight: 600; flex: 1;
      padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .detail-action-btn {
      padding: 6px 14px; border-radius: 14px; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .12s;
    }
    .detail-action-btn:active { opacity: .7; }
    #close-detail-btn { background: var(--fill); color: var(--blue); }
    #download-btn     { background: var(--blue); color: #fff; }
    #delete-btn       { background: transparent; color: var(--red); }

    #detail-img-wrap {
      flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--bg);
    }
    #detail-img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }

    #detail-meta {
      padding: 10px 16px; font-size: 12px; color: var(--text-muted);
      background: var(--surface); border-top: 0.5px solid var(--sep);
      letter-spacing: -0.1px;
    }

    /* ── Hidden canvas ── */
    #capture-canvas { display: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <h1>Receipts</h1>
    <div style="display:flex;align-items:center;gap:4px;margin-left:auto">
      <button id="refresh-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      </button>
      <span id="receipt-count">0</span>
    </div>
  </header>

  <!-- Camera Panel -->
  <div id="camera-panel" class="panel active">
    <div id="video-container">
      <video id="video" autoplay playsinline muted></video>
      <div id="viewfinder">
        <div class="vf-corner tl"></div>
        <div class="vf-corner tr"></div>
        <div class="vf-corner bl"></div>
        <div class="vf-corner br"></div>
      </div>
      <div id="flash"></div>
    </div>
    <div id="no-camera">
      <div class="icon">📷</div>
      <p>Camera access is required.<br>Please allow camera access and try again.</p>
      <button id="retry-camera">Allow Camera</button>
    </div>
    <div id="camera-controls">
      <div class="ctrl-placeholder"></div>
      <button id="capture-btn" aria-label="Capture receipt"></button>
      <button id="flip-btn" aria-label="Flip camera">🔄</button>
    </div>
  </div>

  <!-- Gallery Panel -->
  <div id="gallery-panel" class="panel">
    <div id="storage-bar-wrap">
      <div id="storage-label">Storage: calculating…</div>
      <div id="storage-track"><div id="storage-fill"></div></div>
    </div>
    <div id="gallery-grid"></div>
    <div id="empty-gallery">
      <div class="icon">🧾</div>
      <p>No receipts yet.<br>Switch to Capture to take your first photo.</p>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav>
    <button class="tab-btn active" data-panel="camera-panel">
      <svg viewBox="0 0 28 28" fill="currentColor" aria-hidden="true">
        <path d="M10.2 5 8.7 7H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.7L17.8 5h-7.6zm3.8 14a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
      </svg>
      Capture
    </button>
    <button class="tab-btn" data-panel="gallery-panel">
      <svg viewBox="0 0 28 28" fill="currentColor" aria-hidden="true">
        <path d="M4 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm2 0v9.6l4-4 4 4.8 3-3 5 5V6H6zm0 16h16v-2.1l-5-5-3 3-4-4.8-4 4V22z"/>
      </svg>
      Gallery
    </button>
  </nav>

</div>

<!-- Preview Modal (bottom sheet) -->
<div id="preview-modal" role="dialog" aria-modal="true" aria-label="Preview receipt">
  <div id="preview-sheet">
    <div class="sheet-handle"></div>
    <h2>Save Receipt</h2>
    <div id="crop-status"></div>
    <div id="crop-toggle">
      <button class="crop-opt active" id="use-crop-btn">Cropped</button>
      <button class="crop-opt" id="use-orig-btn">Original</button>
    </div>
    <img id="preview-img" alt="Captured receipt preview">
    <input id="receipt-name-input" type="text" placeholder="Receipt name" maxlength="80" autocomplete="off">
    <div class="modal-actions">
      <button id="save-btn">Save</button>
      <button id="discard-btn">Discard</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div id="detail-modal" role="dialog" aria-modal="true" aria-label="Receipt detail">
  <div id="detail-toolbar">
    <span id="detail-name"></span>
    <button class="detail-action-btn" id="close-detail-btn">Close</button>
    <button class="detail-action-btn" id="download-btn">Download</button>
    <button class="detail-action-btn" id="delete-btn">Delete</button>
  </div>
  <div id="detail-img-wrap">
    <img id="detail-img" alt="Receipt detail">
  </div>
  <div id="detail-meta" id="detail-meta"></div>
</div>

<canvas id="capture-canvas"></canvas>

<script>
// ── IndexedDB ──────────────────────────────────────────────────
const DB_NAME = 'receipts-db';
const DB_VERSION = 1;
const STORE = 'receipts';
const BUDGET_BYTES = 500 * 1024 * 1024;

let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        const store = d.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('ts', 'ts');
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbGetAll() {
  const tx = db.transaction(STORE, 'readonly');
  return new Promise((resolve, reject) => {
    const req = tx.objectStore(STORE).index('ts').getAll();
    req.onsuccess = e => resolve(e.target.result.reverse());
    req.onerror = e => reject(e.target.error);
  });
}

async function dbPut(record) {
  const tx = db.transaction(STORE, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = tx.objectStore(STORE).put(record);
    req.onsuccess = () => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

async function dbDelete(id) {
  const tx = db.transaction(STORE, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

// ── Camera ────────────────────────────────────────────────────
const video = document.getElementById('video');
const flash = document.getElementById('flash');
const noCamera = document.getElementById('no-camera');
const captureCanvas = document.getElementById('capture-canvas');
const ctx = captureCanvas.getContext('2d');

let facingMode = 'environment';
let stream = null;

async function startCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  noCamera.classList.remove('visible');
  video.style.display = 'block';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1920 }, height: { ideal: 2560 } },
      audio: false
    });
    video.srcObject = stream;
  } catch (err) {
    console.error('Camera error:', err);
    video.style.display = 'none';
    noCamera.classList.add('visible');
  }
}

document.getElementById('flip-btn').addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

document.getElementById('retry-camera').addEventListener('click', startCamera);

// ── Capture ───────────────────────────────────────────────────
const previewModal = document.getElementById('preview-modal');
const previewImg = document.getElementById('preview-img');
const nameInput = document.getElementById('receipt-name-input');
const cropStatus = document.getElementById('crop-status');
const cropToggle = document.getElementById('crop-toggle');
const useCropBtn = document.getElementById('use-crop-btn');
const useOrigBtn = document.getElementById('use-orig-btn');

let pendingDataURL = null;     // what will be saved
let pendingOriginalURL = null;
let pendingCroppedURL = null;

document.getElementById('capture-btn').addEventListener('click', async () => {
  if (!stream) return;

  // Flash
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 150);

  // Draw frame to canvas
  const { videoWidth: w, videoHeight: h } = video;
  captureCanvas.width = w;
  captureCanvas.height = h;
  ctx.drawImage(video, 0, 0, w, h);

  const originalURL = captureCanvas.toDataURL('image/jpeg', 0.88);
  pendingOriginalURL = originalURL;
  pendingCroppedURL = null;
  pendingDataURL = originalURL;

  // Show preview immediately
  previewImg.src = originalURL;
  nameInput.value = defaultReceiptName();
  cropToggle.style.display = 'none';
  cropStatus.className = '';
  cropStatus.textContent = scanbotSdk ? 'Detecting receipt…' : '';
  previewModal.classList.add('visible');

  // Run auto-crop if Scanbot SDK is ready
  if (scanbotSdk) {
    const cropped = await detectAndCrop(captureCanvas);
    if (cropped) {
      pendingCroppedURL = cropped;
      pendingDataURL = cropped;
      previewImg.src = cropped;
      cropStatus.textContent = '✓ Receipt detected';
      cropStatus.className = 'found';
      cropToggle.style.display = 'flex';
      useCropBtn.classList.add('active');
      useOrigBtn.classList.remove('active');
    } else {
      cropStatus.textContent = 'Receipt not detected — saving full photo';
      cropStatus.className = '';
    }
  }
});

useCropBtn.addEventListener('click', () => {
  if (!pendingCroppedURL) return;
  pendingDataURL = pendingCroppedURL;
  previewImg.src = pendingCroppedURL;
  useCropBtn.classList.add('active');
  useOrigBtn.classList.remove('active');
});

useOrigBtn.addEventListener('click', () => {
  pendingDataURL = pendingOriginalURL;
  previewImg.src = pendingOriginalURL;
  useOrigBtn.classList.add('active');
  useCropBtn.classList.remove('active');
});

function defaultReceiptName() {
  const now = new Date();
  return `Receipt ${now.toLocaleDateString()} ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
}

// ── Save / Discard ────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', async () => {
  if (!pendingDataURL) return;
  const name = nameInput.value.trim() || defaultReceiptName();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2);
  const ts = Date.now();
  const sizeBytes = Math.round((pendingDataURL.length * 3) / 4);

  await dbPut({ id, name, ts, dataURL: pendingDataURL, sizeBytes });
  pendingDataURL = null;
  previewModal.classList.remove('visible');
  await refreshGallery();
  requestPersistentStorage();
});

document.getElementById('discard-btn').addEventListener('click', () => {
  pendingDataURL = null;
  pendingOriginalURL = null;
  pendingCroppedURL = null;
  previewModal.classList.remove('visible');
});

// ── Gallery ───────────────────────────────────────────────────
const grid = document.getElementById('gallery-grid');
const emptyGallery = document.getElementById('empty-gallery');
const receiptCount = document.getElementById('receipt-count');
const storageLabel = document.getElementById('storage-label');
const storageFill = document.getElementById('storage-fill');

async function refreshGallery() {
  const records = await dbGetAll();
  grid.innerHTML = '';
  receiptCount.textContent = records.length;

  if (records.length === 0) {
    emptyGallery.classList.add('visible');
    updateStorageBar(0);
    return;
  }
  emptyGallery.classList.remove('visible');

  let totalBytes = 0;
  records.forEach(r => {
    totalBytes += r.sizeBytes || 0;
    const card = document.createElement('div');
    card.className = 'receipt-card';
    card.innerHTML = `
      <img src="${r.dataURL}" alt="${escHtml(r.name)}" loading="lazy">
      <div class="receipt-card-label">${escHtml(r.name)}</div>`;
    card.addEventListener('click', () => openDetail(r));
    grid.appendChild(card);
  });
  updateStorageBar(totalBytes);
}

function updateStorageBar(bytes) {
  const pct = Math.min(100, (bytes / BUDGET_BYTES) * 100).toFixed(1);
  const used = formatBytes(bytes);
  storageLabel.textContent = `Storage: ${used} / 500 MB used (${pct}%)`;
  storageFill.style.width = pct + '%';
  storageFill.style.background = pct > 80 ? '#e94560' : '#53c0f0';
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

// ── Detail Modal ──────────────────────────────────────────────
const detailModal = document.getElementById('detail-modal');
const detailImg = document.getElementById('detail-img');
const detailName = document.getElementById('detail-name');
const detailMeta = document.getElementById('detail-meta');
let currentRecord = null;

function openDetail(record) {
  currentRecord = record;
  detailImg.src = record.dataURL;
  detailName.textContent = record.name;
  detailMeta.textContent = `Saved: ${new Date(record.ts).toLocaleString()} · Size: ${formatBytes(record.sizeBytes || 0)}`;
  detailModal.classList.add('visible');
}

document.getElementById('close-detail-btn').addEventListener('click', () => {
  detailModal.classList.remove('visible');
  currentRecord = null;
});

document.getElementById('download-btn').addEventListener('click', () => {
  if (!currentRecord) return;
  const a = document.createElement('a');
  a.href = currentRecord.dataURL;
  a.download = currentRecord.name.replace(/[^a-z0-9 _-]/gi, '_') + '.jpg';
  a.click();
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!currentRecord) return;
  if (!confirm(`Delete "${currentRecord.name}"?`)) return;
  await dbDelete(currentRecord.id);
  detailModal.classList.remove('visible');
  currentRecord = null;
  await refreshGallery();
});

// ── Tabs ──────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.panel).classList.add('active');
    if (btn.dataset.panel === 'gallery-panel') refreshGallery();
    if (btn.dataset.panel === 'camera-panel' && !stream) startCamera();
  });
});

// ── Persistent Storage ────────────────────────────────────────
async function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    await navigator.storage.persist();
  }
}

// ── Helpers ───────────────────────────────────────────────────
function escHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Scanbot SDK — document detection ──────────────────────────
let scanbotSdk = null;

async function initScanbot() {
  try {
    scanbotSdk = await ScanbotSDK.initialize({
      licenseKey: '',
      enginePath: 'https://cdn.jsdelivr.net/npm/scanbot-web-sdk@8.0.1/bundle/bin/complete/'
    });
  } catch (e) {
    console.warn('Scanbot SDK unavailable:', e);
    scanbotSdk = null;
  }
}

async function detectAndCrop(canvas) {
  if (!scanbotSdk) return null;
  try {
    // v8: detectDocument takes an ArrayBuffer directly
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.88));
    const buffer = await blob.arrayBuffer();

    const result = await scanbotSdk.detectDocument(buffer);
    if (result.status !== 'OK' || !result.pointsNormalized) return null;

    // v8: imageCrop replaces cropAndRotateImageCcw
    const croppedBuffer = await scanbotSdk.imageCrop(buffer, result.pointsNormalized);

    // Convert back to data URL for storage
    return await new Promise((res, rej) => {
      const reader = new FileReader();
      reader.onload = () => res(reader.result);
      reader.onerror = rej;
      reader.readAsDataURL(new Blob([croppedBuffer], { type: 'image/jpeg' }));
    });
  } catch (e) {
    console.error('Scanbot detection error:', e);
    return null;
  }
}

document.getElementById('refresh-btn').addEventListener('click', () => {
  location.reload();
});

// ── Service Worker ────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ── Init ──────────────────────────────────────────────────────
(async () => {
  db = await openDB();
  await initScanbot();
  await refreshGallery();
  startCamera();
  requestPersistentStorage();
})();
</script>
