<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Receipts">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Receipt Capture</title>
  <!-- Scanbot Web SDK — document detection -->
  <script src="https://cdn.jsdelivr.net/npm/scanbot-web-sdk@8.0.1/bundle/ScanbotSDK.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── iOS System Colors ── */
    :root {
      --bg:          #F2F2F7;
      --surface:     #FFFFFF;
      --surface2:    #F2F2F7;
      --blue:        #007AFF;
      --red:         #FF3B30;
      --green:       #34C759;
      --text:        #000000;
      --text2:       rgba(60, 60, 67, 0.85);
      --text-muted:  #8E8E93;
      --sep:         rgba(60, 60, 67, 0.29);
      --sep-opaque:  #C6C6C8;
      --fill:        rgba(118, 118, 128, 0.12);
      --fill2:       rgba(118, 118, 128, 0.08);
      --safe-top:    env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      /* Legacy aliases used by existing JS inline-style references */
      --accent:      #FF3B30;
      --accent2:     #007AFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:         #000000;
        --surface:    #1C1C1E;
        --surface2:   #2C2C2E;
        --text:       #FFFFFF;
        --text2:      rgba(235, 235, 245, 0.75);
        --text-muted: #8E8E93;
        --sep:        rgba(84, 84, 88, 0.65);
        --sep-opaque: #38383A;
        --fill:       rgba(118, 118, 128, 0.24);
        --fill2:      rgba(118, 118, 128, 0.18);
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Layout ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: var(--safe-top);
    }

    /* ── Navigation Bar ── */
    header {
      background: var(--bg);
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .header-top {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    header h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 0 0 8px;
      line-height: 1.1;
    }
    #app-version { font-size: 11px; color: var(--text-muted); margin-right: 6px; }
    #receipt-count {
      background: var(--red);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      padding: 1px 7px;
      min-width: 22px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    /* ── Refresh button ── */
    #refresh-btn {
      background: none; border: none;
      color: var(--blue); cursor: pointer;
      padding: 4px; margin-right: 6px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .15s;
    }
    #refresh-btn:active { opacity: .6; }
    #refresh-btn svg { width: 19px; height: 19px; }

    /* ── Panels ── */
    .panel { display: none; flex: 1; overflow: hidden; flex-direction: column; min-height: 0; }
    .panel.active { display: flex; }

    /* ── Bottom Tab Bar ── */
    nav {
      display: flex;
      background: rgba(242, 242, 247, 0.92);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-top: 0.5px solid var(--sep);
      height: calc(49px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      nav { background: rgba(28, 28, 30, 0.92); }
    }
    nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 400;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 6px 0 2px;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.1px;
      transition: color 0.1s;
    }
    nav button svg { width: 26px; height: 26px; }
    nav button.active { color: var(--blue); font-weight: 500; }
    nav button .icon-filled { display: none; }
    nav button .icon-outline { display: block; }
    nav button.active .icon-filled { display: block; }
    nav button.active .icon-outline { display: none; }

    /* ── Camera Panel ── */
    #camera-panel { position: relative; background: #000; }

    #scanner-container {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* No-camera */
    #no-camera {
      display: none;
      position: absolute; inset: 0;
      background: var(--bg);
      align-items: center; justify-content: center;
      flex-direction: column; gap: 12px; text-align: center; padding: 32px 24px;
      z-index: 10;
    }
    #no-camera.visible { display: flex; }
    #no-camera .icon { font-size: 52px; }
    #no-camera p { color: var(--text-muted); font-size: 15px; line-height: 1.6; }
    #retry-camera {
      margin-top: 8px; padding: 12px 28px;
      background: var(--blue); color: #fff;
      border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
    }

    /* ── Preview Modal — iOS bottom sheet ── */
    #preview-modal {
      display: none;
      position: fixed; inset: 0;
      z-index: 200;
      align-items: flex-end;
    }
    #preview-modal.visible { display: flex; }
    #preview-modal::before {
      content: '';
      position: absolute; inset: 0;
      background: rgba(0,0,0,.4);
    }

    #preview-sheet {
      position: relative;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      padding: 0 20px;
      padding-bottom: calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-height: 92vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      animation: sheetUp 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .sheet-handle {
      width: 36px; height: 5px;
      background: var(--fill);
      border-radius: 3px;
      margin: 12px 0 2px;
      flex-shrink: 0;
    }

    #preview-modal h2 {
      font-size: 17px; font-weight: 600;
      letter-spacing: -0.3px; color: var(--text);
    }

    #preview-img {
      width: 100%; max-height: 42vh;
      border-radius: 12px;
      object-fit: contain;
      background: var(--surface2);
    }

    /* ── Auto-crop UI ── */
    #crop-status {
      font-size: 13px; color: var(--text-muted);
      min-height: 16px; text-align: center;
    }
    #crop-status.found { color: var(--green); }

    /* iOS segmented control */
    #crop-toggle {
      display: none;
      background: var(--fill);
      border-radius: 9px;
      padding: 2px;
      width: 100%;
    }
    .crop-opt {
      flex: 1; padding: 7px 12px;
      border: none; border-radius: 7px;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px; font-weight: 500;
      cursor: pointer; font-family: inherit;
      transition: background .15s, color .15s, box-shadow .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .crop-opt.active {
      background: var(--surface);
      color: var(--text);
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0,0,0,.12), 0 0.5px 1px rgba(0,0,0,.08);
    }

    #receipt-name-input {
      width: 100%; padding: 11px 14px;
      background: var(--fill2);
      border: none; border-radius: 10px;
      color: var(--text); font-size: 16px; font-family: inherit;
    }
    #receipt-name-input::placeholder { color: var(--text-muted); }
    #receipt-name-input:focus { outline: none; }

    .modal-actions { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .modal-actions button {
      width: 100%; padding: 15px;
      border-radius: 14px; border: none;
      font-size: 17px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .12s;
    }
    .modal-actions button:active { opacity: .72; }
    #save-btn    { background: var(--blue); color: #fff; }
    #discard-btn { background: var(--fill); color: var(--red); }

    /* ── Gallery Panel ── */
    #gallery-panel { overflow-y: auto; background: var(--bg); -webkit-overflow-scrolling: touch; }

    #storage-bar-wrap {
      padding: 10px 16px 12px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--sep);
      flex-shrink: 0;
    }
    #storage-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
    #storage-track { height: 4px; background: var(--fill); border-radius: 2px; overflow: hidden; }
    #storage-fill  { height: 100%; background: var(--blue); border-radius: 2px; transition: width .4s, background .4s; width: 0%; }

    /* ── Gallery Section Headers ── */
    .gallery-section-header {
      font-size: 20px; font-weight: 700;
      padding: 20px 16px 8px;
      color: var(--text);
      letter-spacing: 0.2px;
    }
    .gallery-section-header:first-child { padding-top: 12px; }

    #gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 4px 16px 16px;
      background: transparent;
    }
    .receipt-card {
      background: var(--surface);
      overflow: hidden; cursor: pointer;
      transition: transform .15s, opacity .12s;
      -webkit-tap-highlight-color: transparent;
      border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 0.5px 1px rgba(0,0,0,.04);
    }
    .receipt-card:active { transform: scale(0.96); opacity: .85; }
    .receipt-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; border-radius: 12px 12px 0 0; }
    .receipt-card-label {
      padding: 8px 10px;
      font-size: 13px; font-weight: 500; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: -0.1px;
    }
    .receipt-card-date {
      padding: 0 10px 8px;
      font-size: 11px; color: var(--text-muted);
    }

    #empty-gallery {
      display: none; flex: 1; align-items: center; justify-content: center;
      flex-direction: column; gap: 8px; padding: 48px 24px; text-align: center;
    }
    #empty-gallery.visible { display: flex; }
    #empty-gallery .icon { font-size: 56px; opacity: .4; }
    #empty-gallery p { color: var(--text-muted); font-size: 15px; line-height: 1.5; }

    /* ── Detail Modal ── */
    #detail-modal {
      display: none; position: fixed; inset: 0;
      background: var(--bg); z-index: 200;
      flex-direction: column;
      padding-top: var(--safe-top); padding-bottom: var(--safe-bottom);
      transition: background 0.25s;
    }
    #detail-modal.visible { display: flex; }
    #detail-modal.dragging { transition: none; }
    #detail-modal .detail-drag-wrap {
      display: flex; flex-direction: column; flex: 1; min-height: 0;
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s;
    }
    #detail-modal.dragging .detail-drag-wrap { transition: none; }

    #detail-toolbar {
      display: flex; align-items: center;
      height: 44px; padding: 0 8px;
      background: rgba(242, 242, 247, 0.88);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 0.5px solid var(--sep);
      gap: 4px; flex-shrink: 0;
    }
    @media (prefers-color-scheme: dark) {
      #detail-toolbar { background: rgba(28, 28, 30, 0.88); }
    }
    .detail-back-btn {
      background: none; border: none;
      color: var(--blue); cursor: pointer;
      font-size: 17px; font-family: inherit;
      display: flex; align-items: center; gap: 4px;
      padding: 4px 8px 4px 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .12s;
      flex-shrink: 0;
    }
    .detail-back-btn:active { opacity: .5; }
    .detail-back-btn svg { flex-shrink: 0; }
    #detail-name {
      font-size: 15px; font-weight: 600; flex: 1;
      padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-align: center;
    }
    .detail-action-btn {
      padding: 6px 10px; border-radius: 8px; border: none;
      background: none; cursor: pointer;
      font-family: inherit; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .12s;
      display: flex; align-items: center; justify-content: center;
    }
    .detail-action-btn:active { opacity: .5; }
    #download-btn     { color: var(--blue); }
    #delete-btn       { color: var(--red); }

    #detail-img-wrap {
      flex: 1; overflow: auto; -webkit-overflow-scrolling: touch;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; background: var(--bg);
    }
    #detail-img { max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain; }

    #detail-meta {
      padding: 10px 16px; font-size: 12px; color: var(--text-muted);
      background: var(--surface); border-top: 0.5px solid var(--sep);
      letter-spacing: -0.1px;
    }

    /* ── Toast Notification ── */
    #toast {
      position: fixed;
      top: calc(var(--safe-top) + 12px);
      left: 50%; transform: translateX(-50%) translateY(-120px);
      background: var(--surface);
      color: var(--text);
      font-size: 15px; font-weight: 500;
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
      z-index: 999;
      display: flex; align-items: center; gap: 8px;
      transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      pointer-events: none;
    }
    #toast.visible { transform: translateX(-50%) translateY(0); }
    #toast .toast-icon {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--green);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #toast .toast-icon svg { width: 14px; height: 14px; }

    /* ── iOS Action Sheet ── */
    #action-sheet-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      z-index: 300;
      align-items: flex-end; justify-content: center;
    }
    #action-sheet-overlay.visible { display: flex; }
    #action-sheet {
      width: calc(100% - 16px);
      margin-bottom: calc(8px + var(--safe-bottom));
      display: flex; flex-direction: column; gap: 8px;
      animation: sheetUp 0.32s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .action-sheet-group {
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
    }
    @media (prefers-color-scheme: dark) {
      .action-sheet-group { background: var(--surface2); }
    }
    .action-sheet-title {
      padding: 14px 16px 4px;
      font-size: 13px; color: var(--text-muted);
      text-align: center;
    }
    .action-sheet-btn {
      width: 100%; padding: 18px 16px;
      border: none; background: none;
      font-size: 20px; font-family: inherit;
      cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent;
      color: var(--blue);
    }
    .action-sheet-btn:active { background: var(--fill); }
    .action-sheet-btn.destructive { color: var(--red); }
    .action-sheet-btn + .action-sheet-btn {
      border-top: 0.5px solid var(--sep);
    }
    .action-sheet-cancel {
      font-weight: 600;
    }

    /* ── Hidden canvas ── */
    #capture-canvas { display: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="header-top">
      <button id="refresh-btn" aria-label="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      </button>
      <span id="receipt-count">0</span>
    </div>
    <h1>Receipts</h1>
  </header>

  <!-- Camera Panel -->
  <div id="camera-panel" class="panel active">
    <div id="scanner-container"></div>
    <div id="no-camera">
      <div class="icon">📷</div>
      <p>Camera access is required.<br>Please allow camera access and try again.</p>
      <button id="retry-camera">Allow Camera</button>
    </div>
  </div>

  <!-- Gallery Panel -->
  <div id="gallery-panel" class="panel">
    <div id="storage-bar-wrap">
      <div id="storage-label">Storage: calculating…</div>
      <div id="storage-track"><div id="storage-fill"></div></div>
    </div>
    <div id="gallery-sections"></div>
    <div id="empty-gallery">
      <div class="icon">🧾</div>
      <p>No receipts yet.<br>Switch to Capture to take your first photo.</p>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav>
    <button class="tab-btn active" data-panel="camera-panel">
      <!-- Filled (active) -->
      <svg class="icon-filled" viewBox="0 0 28 28" fill="currentColor" aria-hidden="true">
        <path d="M10.2 5 8.7 7H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.7L17.8 5h-7.6zM14 19a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
      </svg>
      <!-- Outline (inactive) -->
      <svg class="icon-outline" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M10.2 5 8.7 7H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.7L17.8 5h-7.6z"/>
        <circle cx="14" cy="14" r="4"/>
      </svg>
      Capture
    </button>
    <button class="tab-btn" data-panel="gallery-panel">
      <!-- Filled (active) -->
      <svg class="icon-filled" viewBox="0 0 28 28" fill="currentColor" aria-hidden="true">
        <path d="M4 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6zm2 0v9.6l4-4 4 4.8 3-3 5 5V6H6zm0 16h16v-2.1l-5-5-3 3-4-4.8-4 4V22z"/>
      </svg>
      <!-- Outline (inactive) -->
      <svg class="icon-outline" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="4" y="4" width="20" height="20" rx="2"/>
        <path d="M4 16l5-5 4 4.5 3-3 6 6"/>
      </svg>
      Gallery
    </button>
  </nav>

</div>

<!-- Preview Modal (bottom sheet) -->
<div id="preview-modal" role="dialog" aria-modal="true" aria-label="Preview receipt">
  <div id="preview-sheet">
    <div class="sheet-handle"></div>
    <h2>Save Receipt</h2>
    <div id="crop-status"></div>
    <div id="crop-toggle">
      <button class="crop-opt active" id="use-crop-btn">Cropped</button>
      <button class="crop-opt" id="use-orig-btn">Original</button>
    </div>
    <img id="preview-img" alt="Captured receipt preview">
    <input id="receipt-name-input" type="text" placeholder="Receipt name" maxlength="80" autocomplete="off">
    <div class="modal-actions">
      <button id="save-btn">Save</button>
      <button id="discard-btn">Discard</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div id="detail-modal" role="dialog" aria-modal="true" aria-label="Receipt detail">
  <div class="detail-drag-wrap">
    <div id="detail-toolbar">
      <button class="detail-back-btn" id="close-detail-btn">
        <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg>
        Gallery
      </button>
      <span id="detail-name"></span>
      <button class="detail-action-btn" id="download-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="detail-action-btn" id="delete-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
    <div id="detail-img-wrap">
      <img id="detail-img" alt="Receipt detail">
    </div>
    <div id="detail-meta"></div>
  </div>
</div>


<!-- Toast -->
<div id="toast">
  <span class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></span>
  <span id="toast-msg">Saved</span>
</div>

<!-- Action Sheet -->
<div id="action-sheet-overlay">
  <div id="action-sheet">
    <div class="action-sheet-group">
      <div class="action-sheet-title" id="action-sheet-title"></div>
      <button class="action-sheet-btn destructive" id="action-sheet-confirm">Delete</button>
    </div>
    <div class="action-sheet-group">
      <button class="action-sheet-btn action-sheet-cancel" id="action-sheet-cancel">Cancel</button>
    </div>
  </div>
</div>

<script>
// ── IndexedDB ──────────────────────────────────────────────────
const DB_NAME = 'receipts-db';
const DB_VERSION = 1;
const STORE = 'receipts';
const BUDGET_BYTES = 500 * 1024 * 1024;

let db;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) {
        const store = d.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('ts', 'ts');
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = e => reject(e.target.error);
  });
}

async function dbGetAll() {
  const tx = db.transaction(STORE, 'readonly');
  return new Promise((resolve, reject) => {
    const req = tx.objectStore(STORE).index('ts').getAll();
    req.onsuccess = e => resolve(e.target.result.reverse());
    req.onerror = e => reject(e.target.error);
  });
}

async function dbPut(record) {
  const tx = db.transaction(STORE, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = tx.objectStore(STORE).put(record);
    req.onsuccess = () => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

async function dbDelete(id) {
  const tx = db.transaction(STORE, 'readwrite');
  return new Promise((resolve, reject) => {
    const req = tx.objectStore(STORE).delete(id);
    req.onsuccess = () => resolve();
    req.onerror = e => reject(e.target.error);
  });
}

// ── Scanner ───────────────────────────────────────────────────
const noCamera = document.getElementById('no-camera');

let scanner = null;

async function initScanner() {
  if (scanner) { await scanner.dispose(); scanner = null; }
  noCamera.classList.remove('visible');

  if (!scanbotSdk) {
    noCamera.classList.add('visible');
    return;
  }

  try {
    scanner = await scanbotSdk.createDocumentScanner({
      containerId: 'scanner-container',
      autoCaptureEnabled: true,
      autoCaptureSensitivity: 0.66,
      autoCaptureDelay: 1200,
      useImageCaptureAPI: true,
      mirrored: false,
      scannerConfiguration: {
        parameters: {
          acceptedSizeScore: 50,
          acceptedAngleScore: 65,
          acceptedBrightnessThreshold: 0,
        }
      },
      style: {
        outline: {
          polygon: {
            strokeCapturing: '#00E676',
            strokeSearching: '#FFD740',
            fillCapturing: 'rgba(0,230,118,0.12)',
            fillSearching: 'transparent',
            strokeWidthCapturing: 3,
            strokeWidthSearching: 2,
          },
          label: {
            backgroundColor: 'rgba(0,0,0,0.55)',
            color: 'white',
            fontSize: '13px',
            padding: '4px 12px',
            borderRadius: '12px',
          }
        },
        captureButton: { visible: false }
      },
      text: {
        hint: {
          NOT_ACQUIRED: 'Searching for document…',
          OK: 'Hold still…',
          OK_BUT_TOO_SMALL: 'Move closer',
          OK_BUT_BAD_ANGLES: 'Reduce angle',
          OK_BUT_BAD_ASPECT_RATIO: 'Adjust position',
          ERROR_NOTHING_DETECTED: 'No document found',
          ERROR_PARTIALLY_VISIBLE: 'Document partially visible',
          ERROR_TOO_DARK: 'Too dark — improve lighting',
        }
      },
      onDocumentDetected: async (response) => {
        if (scanner) scanner.disableAutoCapture();

        const toDataURL = async (image) => {
          if (!image) return null;
          const bytes = await image.toJpeg(93);
          const blob = new Blob([bytes], { type: 'image/jpeg' });
          return new Promise((res, rej) => {
            const reader = new FileReader();
            reader.onload = () => res(reader.result);
            reader.onerror = rej;
            reader.readAsDataURL(blob);
          });
        };

        pendingOriginalURL = await toDataURL(response.originalImage);
        pendingCroppedURL = await toDataURL(response.result?.croppedImage);
        pendingDataURL = pendingCroppedURL || pendingOriginalURL;

        previewImg.src = pendingDataURL;
        nameInput.value = defaultReceiptName();

        if (pendingCroppedURL) {
          cropStatus.textContent = '✓ Document detected';
          cropStatus.className = 'found';
          cropToggle.style.display = 'flex';
          useCropBtn.classList.add('active');
          useOrigBtn.classList.remove('active');
        } else {
          cropStatus.textContent = 'Document not detected — saving full photo';
          cropStatus.className = '';
          cropToggle.style.display = 'none';
        }

        previewModal.classList.add('visible');
      },
      onError: (e) => {
        console.error('Scanner error:', e);
        noCamera.classList.add('visible');
      }
    });
  } catch (e) {
    console.error('Scanner init error:', e);
    noCamera.classList.add('visible');
  }
}

document.getElementById('retry-camera').addEventListener('click', initScanner);

// ── Capture ───────────────────────────────────────────────────
const previewModal = document.getElementById('preview-modal');
const previewImg = document.getElementById('preview-img');
const nameInput = document.getElementById('receipt-name-input');
const cropStatus = document.getElementById('crop-status');
const cropToggle = document.getElementById('crop-toggle');
const useCropBtn = document.getElementById('use-crop-btn');
const useOrigBtn = document.getElementById('use-orig-btn');

let pendingDataURL = null;     // what will be saved
let pendingOriginalURL = null;
let pendingCroppedURL = null;


useCropBtn.addEventListener('click', () => {
  if (!pendingCroppedURL) return;
  pendingDataURL = pendingCroppedURL;
  previewImg.src = pendingCroppedURL;
  useCropBtn.classList.add('active');
  useOrigBtn.classList.remove('active');
});

useOrigBtn.addEventListener('click', () => {
  pendingDataURL = pendingOriginalURL;
  previewImg.src = pendingOriginalURL;
  useOrigBtn.classList.add('active');
  useCropBtn.classList.remove('active');
});

function defaultReceiptName() {
  const now = new Date();
  return `Receipt ${now.toLocaleDateString()} ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
}

// ── Save / Discard ────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', async () => {
  if (!pendingDataURL) return;
  const name = nameInput.value.trim() || defaultReceiptName();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2);
  const ts = Date.now();
  const sizeBytes = Math.round((pendingDataURL.length * 3) / 4);

  await dbPut({ id, name, ts, dataURL: pendingDataURL, sizeBytes });
  pendingDataURL = null;
  previewModal.classList.remove('visible');
  if (scanner) scanner.enableAutoCapture();
  await refreshGallery();
  showToast('Receipt saved');
  requestPersistentStorage();
});

document.getElementById('discard-btn').addEventListener('click', () => {
  pendingDataURL = null;
  pendingOriginalURL = null;
  pendingCroppedURL = null;
  previewModal.classList.remove('visible');
  if (scanner) scanner.enableAutoCapture();
});

// ── Gallery ───────────────────────────────────────────────────
const gallerySections = document.getElementById('gallery-sections');
const emptyGallery = document.getElementById('empty-gallery');
const receiptCount = document.getElementById('receipt-count');
const storageLabel = document.getElementById('storage-label');
const storageFill = document.getElementById('storage-fill');

function dateLabel(ts) {
  const d = new Date(ts);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const recDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (today - recDay) / 86400000;
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
}

function timeLabel(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

async function refreshGallery() {
  const records = await dbGetAll();
  gallerySections.innerHTML = '';
  receiptCount.textContent = records.length;

  if (records.length === 0) {
    emptyGallery.classList.add('visible');
    updateStorageBar(0);
    return;
  }
  emptyGallery.classList.remove('visible');

  // Group by date
  const groups = new Map();
  let totalBytes = 0;
  records.forEach(r => {
    totalBytes += r.sizeBytes || 0;
    const label = dateLabel(r.ts);
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(r);
  });

  groups.forEach((items, label) => {
    const header = document.createElement('div');
    header.className = 'gallery-section-header';
    header.textContent = label;
    gallerySections.appendChild(header);

    const grid = document.createElement('div');
    grid.id = 'gallery-grid';
    items.forEach(r => {
      const card = document.createElement('div');
      card.className = 'receipt-card';
      card.innerHTML = `
        <img src="${r.dataURL}" alt="${escHtml(r.name)}" loading="lazy">
        <div class="receipt-card-label">${escHtml(r.name)}</div>
        <div class="receipt-card-date">${timeLabel(r.ts)}</div>`;
      card.addEventListener('click', () => openDetail(r));
      grid.appendChild(card);
    });
    gallerySections.appendChild(grid);
  });

  updateStorageBar(totalBytes);
}

function updateStorageBar(bytes) {
  const pct = Math.min(100, (bytes / BUDGET_BYTES) * 100).toFixed(1);
  const used = formatBytes(bytes);
  storageLabel.textContent = `Storage: ${used} / 500 MB used (${pct}%)`;
  storageFill.style.width = pct + '%';
  storageFill.style.background = pct > 80 ? '#e94560' : '#53c0f0';
}

function formatBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(1) + ' MB';
}

// ── Detail Modal ──────────────────────────────────────────────
const detailModal = document.getElementById('detail-modal');
const detailImg = document.getElementById('detail-img');
const detailName = document.getElementById('detail-name');
const detailMeta = document.getElementById('detail-meta');
let currentRecord = null;

function openDetail(record) {
  currentRecord = record;
  detailImg.src = record.dataURL;
  detailName.textContent = record.name;
  detailMeta.textContent = `Saved: ${new Date(record.ts).toLocaleString()} · Size: ${formatBytes(record.sizeBytes || 0)}`;
  detailModal.classList.add('visible');
}

document.getElementById('close-detail-btn').addEventListener('click', () => {
  detailModal.classList.remove('visible');
  currentRecord = null;
});

document.getElementById('download-btn').addEventListener('click', () => {
  if (!currentRecord) return;
  const a = document.createElement('a');
  a.href = currentRecord.dataURL;
  a.download = currentRecord.name.replace(/[^a-z0-9 _-]/gi, '_') + '.jpg';
  a.click();
});

document.getElementById('delete-btn').addEventListener('click', async () => {
  if (!currentRecord) return;
  const confirmed = await showActionSheet(
    `Delete "${currentRecord.name}"? This cannot be undone.`,
    'Delete Receipt'
  );
  if (!confirmed) return;
  await dbDelete(currentRecord.id);
  detailModal.classList.remove('visible');
  currentRecord = null;
  await refreshGallery();
});

// ── Swipe-to-dismiss detail modal ─────────────────────────────
{
  const dragWrap = detailModal.querySelector('.detail-drag-wrap');
  let startY = 0, currentY = 0, isDragging = false;

  detailModal.addEventListener('touchstart', (e) => {
    if (e.target.closest('#detail-toolbar') || e.target.closest('.detail-action-btn') || e.target.closest('.detail-back-btn')) return;
    startY = e.touches[0].clientY;
    isDragging = false;
  }, { passive: true });

  detailModal.addEventListener('touchmove', (e) => {
    currentY = e.touches[0].clientY;
    const dy = currentY - startY;
    if (dy < 0) return; // only drag down
    if (dy > 10) isDragging = true;
    if (!isDragging) return;
    detailModal.classList.add('dragging');
    const progress = Math.min(dy / 400, 1);
    dragWrap.style.transform = `translateY(${dy}px) scale(${1 - progress * 0.08})`;
    dragWrap.style.opacity = 1 - progress * 0.3;
    dragWrap.style.borderRadius = `${progress * 16}px`;
    detailModal.style.background = `rgba(0,0,0,${0.6 - progress * 0.6})`;
  }, { passive: true });

  detailModal.addEventListener('touchend', () => {
    if (!isDragging) return;
    detailModal.classList.remove('dragging');
    const dy = currentY - startY;
    if (dy > 150) {
      dragWrap.style.transform = `translateY(${window.innerHeight}px) scale(0.9)`;
      dragWrap.style.opacity = '0';
      setTimeout(() => {
        detailModal.classList.remove('visible');
        dragWrap.style.transform = '';
        dragWrap.style.opacity = '';
        dragWrap.style.borderRadius = '';
        detailModal.style.background = '';
        currentRecord = null;
      }, 300);
    } else {
      dragWrap.style.transform = '';
      dragWrap.style.opacity = '';
      dragWrap.style.borderRadius = '';
      detailModal.style.background = '';
    }
    isDragging = false;
  }, { passive: true });
}

// ── Tabs ──────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.panel).classList.add('active');
    if (btn.dataset.panel === 'gallery-panel') {
      if (scanner) { scanner.dispose(); scanner = null; }
      refreshGallery();
    }
    if (btn.dataset.panel === 'camera-panel') initScanner();
  });
});

// ── Persistent Storage ────────────────────────────────────────
async function requestPersistentStorage() {
  if (navigator.storage && navigator.storage.persist) {
    await navigator.storage.persist();
  }
}

// ── Toast ─────────────────────────────────────────────────────
const toast = document.getElementById('toast');
const toastMsg = document.getElementById('toast-msg');
let toastTimer = null;

function showToast(msg) {
  toastMsg.textContent = msg;
  toast.classList.add('visible');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('visible'), 2200);
}

// ── Action Sheet ──────────────────────────────────────────────
const actionSheetOverlay = document.getElementById('action-sheet-overlay');
const actionSheetTitle = document.getElementById('action-sheet-title');
const actionSheetConfirm = document.getElementById('action-sheet-confirm');
const actionSheetCancel = document.getElementById('action-sheet-cancel');
let actionSheetResolve = null;

function showActionSheet(title, confirmLabel) {
  actionSheetTitle.textContent = title;
  actionSheetConfirm.textContent = confirmLabel;
  actionSheetOverlay.classList.add('visible');
  return new Promise(resolve => { actionSheetResolve = resolve; });
}

actionSheetConfirm.addEventListener('click', () => {
  actionSheetOverlay.classList.remove('visible');
  if (actionSheetResolve) actionSheetResolve(true);
  actionSheetResolve = null;
});
actionSheetCancel.addEventListener('click', () => {
  actionSheetOverlay.classList.remove('visible');
  if (actionSheetResolve) actionSheetResolve(false);
  actionSheetResolve = null;
});
actionSheetOverlay.addEventListener('click', (e) => {
  if (e.target === actionSheetOverlay) {
    actionSheetOverlay.classList.remove('visible');
    if (actionSheetResolve) actionSheetResolve(false);
    actionSheetResolve = null;
  }
});

// ── Helpers ───────────────────────────────────────────────────
function escHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Scanbot SDK — document detection ──────────────────────────
let scanbotSdk = null;

async function initScanbot() {
  try {
    scanbotSdk = await ScanbotSDK.initialize({
      licenseKey: '',
      enginePath: 'https://cdn.jsdelivr.net/npm/scanbot-web-sdk@8.0.1/bundle/bin/complete/'
    });
  } catch (e) {
    console.warn('Scanbot SDK unavailable:', e);
    scanbotSdk = null;
  }
}


document.getElementById('refresh-btn').addEventListener('click', () => {
  location.reload();
});

// ── Service Worker ────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

// ── Init ──────────────────────────────────────────────────────
(async () => {
  db = await openDB();
  await initScanbot();
  await refreshGallery();
  initScanner();
  requestPersistentStorage();
})();
</script>
</body>
